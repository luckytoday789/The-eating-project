plugins { id 'com.android.application' }

def releaseProperties = new Properties()
def releasePropertiesFile = rootProject.file('../private/android-signing.properties')
if (releasePropertiesFile.exists()) releasePropertiesFile.withInputStream { releaseProperties.load(it) }

android {
    namespace 'cn.dailytraces.journal'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'cn.dailytraces.journal'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        resConfigs 'zh', 'en'
    }
    signingConfigs {
        release {
            if (releasePropertiesFile.exists()) {
                storeFile file(releaseProperties.getProperty('storeFile'))
                storePassword releaseProperties.getProperty('storePassword')
                keyAlias releaseProperties.getProperty('keyAlias')
                keyPassword releaseProperties.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.release }
        release { signingConfig signingConfigs.release; minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { animationsDisabled true }
}

tasks.register('syncJournalAssets', Copy) {
    def nested = rootProject.file('../daily-journal')
    from(nested.isDirectory() ? nested : rootProject.file('..')) {
        include 'index.html', '*.js', '*.css', 'assets/*.svg'
    }
    into layout.projectDirectory.dir('src/main/assets/www')
}
tasks.named('preBuild').configure { dependsOn 'syncJournalAssets' }

dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
